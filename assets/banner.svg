<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="电量计算器 Banner">
  <title>电量计算器</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="0.55" stop-color="#0e1735"/>
      <stop offset="1" stop-color="#131c46"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.86" cy="0.08" r="0.72">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.06" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="nubGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glowA)"/>
  <rect width="1200" height="320" fill="url(#glowB)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <text x="1160" y="268" text-anchor="end" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="160" font-weight="800" letter-spacing="-6" fill="#ffffff" opacity="0.05">100%</text>

  <ellipse cx="170" cy="162" rx="116" ry="74" fill="#3b82f6" opacity="0.26" filter="url(#soft)"/>

  <rect x="72" y="100" width="180" height="122" rx="22" fill="#0a1024" stroke="#60a5fa" stroke-width="5"/>
  <rect x="256" y="138" width="22" height="46" rx="9" fill="#60a5fa" filter="url(#nubGlow)"/>
  <rect x="90" y="114" width="33" height="94" rx="10" fill="url(#cell)"/>
  <rect x="127" y="114" width="33" height="94" rx="10" fill="url(#cell)"/>
  <rect x="164" y="114" width="33" height="94" rx="10" fill="url(#cell)"/>
  <rect x="201" y="114" width="33" height="94" rx="10" fill="url(#cell)"/>

  <rect x="320" y="56" width="208" height="32" rx="16" fill="#0b1226" stroke="#334155" stroke-width="1.5"/>
  <circle cx="340" cy="72" r="4" fill="#22d3ee"/>
  <text x="354" y="77" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" letter-spacing="0.5" fill="#93c5fd">AI POWERED · 纯属娱乐</text>

  <text x="318" y="160" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="60" font-weight="800" letter-spacing="3" fill="#f8fafc">电量计算器</text>
  <text x="322" y="200" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="17" letter-spacing="5.5" fill="#7dd3fc">BATTERY CALCULATOR</text>
  <text x="322" y="242" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="16" fill="#94a3b8">点击「开始计算」，3 秒后告诉你：有电</text>

  <text x="1162" y="58" text-anchor="end" font-family="'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#475569">v1.0 · Java Swing</text>

  <rect x="0" y="314" width="1200" height="3" fill="url(#rule)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 430" width="1340" height="430" role="img" aria-label="电量计算器界面预览">
  <title>电量计算器 - 界面预览</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="0.5" stop-color="#0d1531"/>
      <stop offset="1" stop-color="#131c46"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f8ef7"/>
    </linearGradient>
    <style>
      .ui { font-family: 'Microsoft YaHei UI','Microsoft YaHei','PingFang SC','Noto Sans SC','Segoe UI',sans-serif; }
      .win-title { font-size: 12px; fill: #475569; }
      .app-title { font-size: 24px; font-weight: 700; fill: #1a56db; }
      .btn-label { font-size: 13px; fill: #ffffff; }
      .status { font-size: 11px; fill: #6b7280; }
      .result { font-size: 18px; font-weight: 700; fill: #16a34a; }
      .caption { font-size: 14px; fill: #94a3b8; }
      .note { font-size: 13px; fill: #64748b; letter-spacing: 0.5px; }
    </style>
    <clipPath id="w1"><rect x="40" y="60" width="400" height="280" rx="12"/></clipPath>
    <clipPath id="w2"><rect x="470" y="60" width="400" height="280" rx="12"/></clipPath>
    <clipPath id="w3"><rect x="900" y="60" width="400" height="280" rx="12"/></clipPath>
  </defs>

  <rect width="1340" height="430" fill="url(#bg)"/>
  <rect width="1340" height="430" fill="url(#halo)"/>
  <rect width="1340" height="430" fill="url(#dots)"/>
  <text x="40" y="36" class="ui note">界面预览 · 按实际配色与布局绘制</text>
  <text x="1300" y="36" text-anchor="end" class="ui note">400 × 280 · 不可缩放</text>

  <!-- ============ 窗口 1：待命 ============ -->
  <rect x="46" y="76" width="400" height="280" rx="14" fill="#000000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#w1)">
    <rect x="40" y="60" width="400" height="280" fill="#f0f4ff"/>
    <rect x="40" y="60" width="400" height="34" fill="#ffffff"/>
    <line x1="40" y1="94" x2="440" y2="94" stroke="#e6ebf7" stroke-width="1"/>
    <text x="56" y="82" class="ui win-title">电量计算器</text>
    <line x1="371" y1="77" x2="381" y2="77" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="391" y="72" width="10" height="10" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="406" y1="72" x2="416" y2="82" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="416" y1="72" x2="406" y2="82" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="240" y="172" text-anchor="middle" class="ui app-title">电量计算器</text>
    <rect x="160" y="208" width="160" height="42" rx="7" fill="#2563eb"/>
    <text x="240" y="234" text-anchor="middle" class="ui btn-label">开始计算</text>
  </g>
  <rect x="40" y="60" width="400" height="280" rx="12" fill="none" stroke="#c7d4f5" stroke-width="1"/>

  <!-- ============ 窗口 2：计算中 ============ -->
  <rect x="476" y="76" width="400" height="280" rx="14" fill="#000000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#w2)">
    <rect x="470" y="60" width="400" height="280" fill="#f0f4ff"/>
    <rect x="470" y="60" width="400" height="34" fill="#ffffff"/>
    <line x1="470" y1="94" x2="870" y2="94" stroke="#e6ebf7" stroke-width="1"/>
    <text x="486" y="82" class="ui win-title">电量计算器</text>
    <line x1="801" y1="77" x2="811" y2="77" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="821" y="72" width="10" height="10" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="836" y1="72" x2="846" y2="82" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="846" y1="72" x2="836" y2="82" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="670" y="172" text-anchor="middle" class="ui app-title">电量计算器</text>
    <rect x="520" y="210" width="300" height="20" rx="4" fill="#ffffff" stroke="#dbe4ff" stroke-width="1"/>
    <rect x="520" y="210" width="192" height="20" rx="4" fill="url(#bar)"/>
    <text x="670" y="258" text-anchor="middle" class="ui status">正在通过AI大模型计算本机电量</text>
  </g>
  <rect x="470" y="60" width="400" height="280" rx="12" fill="none" stroke="#c7d4f5" stroke-width="1"/>

  <!-- ============ 窗口 3：结果 ============ -->
  <rect x="906" y="76" width="400" height="280" rx="14" fill="#000000" opacity="0.45" filter="url(#shadow)"/>
  <g clip-path="url(#w3)">
    <rect x="900" y="60" width="400" height="280" fill="#f0f4ff"/>
    <rect x="900" y="60" width="400" height="34" fill="#ffffff"/>
    <line x1="900" y1="94" x2="1300" y2="94" stroke="#e6ebf7" stroke-width="1"/>
    <text x="916" y="82" class="ui win-title">电量计算器</text>
    <line x1="1231" y1="77" x2="1241" y2="77" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="1251" y="72" width="10" height="10" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="1266" y1="72" x2="1276" y2="82" stroke="#94a3b8" stroke-width="1.6"/>
    <line x1="1276" y1="72" x2="1266" y2="82" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="1100" y="172" text-anchor="middle" class="ui app-title">电量计算器</text>
    <text x="1100" y="248" text-anchor="middle" class="ui result">有电</text>
  </g>
  <rect x="900" y="60" width="400" height="280" rx="12" fill="none" stroke="#c7d4f5" stroke-width="1"/>

  <text x="240" y="392" text-anchor="middle" class="ui caption">① 待命 · 等你点一下</text>
  <text x="670" y="392" text-anchor="middle" class="ui caption">② 计算中 · 进度条真的很忙</text>
  <text x="1100" y="392" text-anchor="middle" class="ui caption">③ 结论 · 有电</text>
</svg>
